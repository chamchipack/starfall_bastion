/* =====================================================================
   GEOMETRY (DOM 없음: tools/gen-pads.js도 이 구간을 그대로 씀)
   ===================================================================== */
/* @geo-start */
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// centripetal Catmull-Rom: 꺾이는 점을 지나는 부드러운 곡선 (튀는 루프 없음)
function catmullRom(pts) {
  const n = pts.length, ext = (a, b) => [2 * a[0] - b[0], 2 * a[1] - b[1]];
  const P = [ext(pts[0], pts[1]), ...pts, ext(pts[n - 1], pts[n - 2])], out = [pts[0].slice()];
  const kd = (a, b) => Math.max(1e-4, Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])));
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    const t0 = 0, t1 = kd(p0, p1), t2 = t1 + kd(p1, p2), t3 = t2 + kd(p2, p3);
    const steps = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 6));
    for (let s = 1; s <= steps; s++) {
      const t = t1 + (t2 - t1) * s / steps;
      const L = (a, b, ta, tb) => [((tb - t) * a[0] + (t - ta) * b[0]) / (tb - ta), ((tb - t) * a[1] + (t - ta) * b[1]) / (tb - ta)];
      const A1 = L(p0, p1, t0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
      out.push(L(L(A1, A2, t0, t2), L(A2, A3, t1, t3), t1, t2));
    }
  }
  return out;
}
function mkPath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function posAt(p, d) {
  d = Math.max(0, Math.min(d, p.len));
  let lo = 0, hi = p.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p.cum[m] <= d) lo = m; else hi = m; }
  const a = p.pts[lo], b = p.pts[hi], seg = p.cum[hi] - p.cum[lo] || 1, k = (d - p.cum[lo]) / seg;
  return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, dx: (b[0] - a[0]) / seg, dy: (b[1] - a[1]) / seg };
}
// 두 번째 이후 경로가 paths[0]의 중간 점에서 끝나면 그 점부터 paths[0]을 따라간다
function groundPaths(m) {
  const main = m.paths[0];
  return m.paths.map((p, i) => {
    const [ex, ey] = p[p.length - 1], j = i ? main.findIndex(q => q[0] === ex && q[1] === ey) : -1;
    const path = mkPath(catmullRom(j >= 0 ? p.concat(main.slice(j + 1)) : p));
    path.own = path.len;

function fit() {

  stageEl.style.left = (innerWidth - W * VIEW) / 2 + 'px'; stageEl.style.top = (innerHeight - H * VIEW) / 2 + 'px';
  const dpr = window.devicePixelRatio || 1;

}

// --- 하늘: 별 3층 + 성운 ---
function makeSky(cols, seed) {
  const r = rng(seed), stars = [];
  for (let i = 0; i < 170; i++) stars.push({ x: r() * W, y: r() * H, l: 0, a: 0.3 + r() * 0.4 });
  for (let i = 0; i < 50; i++) stars.push({ x: r() * W, y: r() * H, l: 1, a: 0.6 + r() * 0.4 });
  for (let i = 0; i < 12; i++) stars.push({ x: r() * W, y: r() * H, l: 2, a: 1, ph: r() * TAU });
  const clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: r() * W, y: 100 + r() * 520, s: 520 + r() * 320, sp: 2 + r() * 3, img: glowSprite(cols[i % cols.length]) });
  return { stars, clouds };
}
function drawSky(sky) {
  const t = REDUCED ? 0 : clock;
  ctx.globalAlpha = 0.16;
  for (const c of sky.clouds) { const x = ((c.x + t * c.sp) % (W + c.s)) - c.s / 2; ctx.drawImage(c.img, x - c.s / 2, c.y - c.s / 2, c.s, c.s); }
  const sp = [3, 8, 16];
  for (const s of sky.stars) {
    const x = ((s.x - t * sp[s.l]) % W + W) % W;
    if (s.l === 0) { ctx.globalAlpha = s.a; ctx.fillStyle = '#c6cdf2'; ctx.fillRect(x, s.y, 1.2, 1.2); }
    else if (s.l === 1) { ctx.globalAlpha = s.a; ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(x, s.y, 1.4, 0, TAU); ctx.fill(); }
    else { const k = 0.5 + 0.5 * Math.sin(clock * 2 + s.ph); ctx.globalAlpha = 0.4 + 0.6 * k; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, s.y, 1.8, 0, TAU); ctx.fill(); ctx.fillRect(x - 5 * k, s.y - 0.5, 10 * k, 1); ctx.fillRect(x - 0.5, s.y - 5 * k, 1, 10 * k); }
  }
  ctx.globalAlpha = 1;
}
const menuSky = makeSky(['#5ce1e6', '#9b6bff', '#ff5cc8'], 99);

// --- 타이틀 행성 ---
let PLANET = null;
function planet() {
  if (PLANET) return PLANET;
  const R = 240, r = rng(7), tex = mk(R * 4, R * 2), g = tex.getContext('2d');
  const cols = ['#2a3b8f', '#3d56b8', '#5c7ce0', '#24306e', '#4a2f8a', '#6a5ad0'];
  for (let y = 0; y < R * 2; y += 8) { g.fillStyle = cols[(r() * cols.length) | 0]; g.globalAlpha = 0.7; g.fillRect(0, y, R * 2, 8 + r() * 10); }
  g.globalAlpha = 0.25; for (let i = 0; i < 40; i++) { g.fillStyle = r() < 0.5 ? '#9be8ff' : '#141a44'; g.beginPath(); g.ellipse(r() * R * 2, r() * R * 2, 20 + r() * 60, 4 + r() * 8, 0, 0, TAU); g.fill(); }
  g.globalAlpha = 1; g.filter = 'blur(5px)'; g.drawImage(tex, 0, 0); g.filter = 'none';
  g.drawImage(tex, 0, 0, R * 2, R * 2, R * 2, 0, R * 2, R * 2);
  const shade = mk(R * 2 + 120, R * 2 + 120), s = shade.getContext('2d'), c = R + 60;
  s.fillStyle = rgrad(s, c - R * 0.45, c - R * 0.45, R * 1.6, ['rgba(0,0,0,0)', 'rgba(0,0,0,.25)', 'rgba(5,6,13,.92)']);
  s.beginPath(); s.arc(c, c, R, 0, TAU); s.fill();
  s.shadowColor = '#5ce1e6'; s.shadowBlur = 40; s.strokeStyle = 'rgba(92,225,230,.55)'; s.lineWidth = 3; s.beginPath(); s.arc(c, c, R, Math.PI * 0.9, Math.PI * 1.75); s.stroke();
  return PLANET = { R, tex, shade };
}
function drawPlanet(cx, cy) {
  const { R, tex, shade } = planet(), off = REDUCED ? 0 : (clock * 10) % (R * 2);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip(); ctx.drawImage(tex, cx - R - off, cy - R, R * 4, R * 2); ctx.restore();

}

/* =====================================================================
   4. GAME: 맵 레이어, 웨이브, Tower / Enemy / Projectile / Effect
   ===================================================================== */
const geoCache = {};
function geo(m) {
  if (geoCache[m.id]) return geoCache[m.id];
  const paths = groundPaths(m);
  const portals = paths.map(p => { const i = p.pts.findIndex(([x]) => x >= 36); const q = p.pts[Math.max(0, i)]; return [q[0], q[1]]; }).filter((q, i, a) => a.findIndex(o => o[0] === q[0] && o[1] === q[1]) === i);  // 입구를 공유하는 경로는 포털 하나
  const fly = paths.map((p, i) => flyPath(p.pts[0], m.base));
  return geoCache[m.id] = { paths, portals, fly, base: m.base };
}

// 배경 천체 (정적 부분)
function paintBody(g, m) {
  const r = rng(m.id.length * 97);
  if (m.id === 'ceres') {
    const cx = 1150, cy = 290, R = 150, pts = [];
    for (let i = 0; i < 26; i++) pts.push(R * (0.8 + r() * 0.2));
    g.beginPath(); pts.forEach((rr, i) => { const a = i / pts.length * TAU; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }); g.closePath();
    g.fillStyle = rgrad(g, cx - 50, cy - 50, R * 1.3, ['#a8523c', '#5a2420', '#1e0b0e']); g.fill();
    g.save(); g.clip();
    for (let i = 0; i < 10; i++) { const x = cx - R + r() * R * 2, y = cy - R + r() * R * 2, cr = 8 + r() * 22;
      g.beginPath(); g.arc(x, y, cr, 0, TAU); g.fillStyle = 'rgba(20,6,8,.45)'; g.fill();
      g.beginPath(); g.arc(x, y, cr, 0.2, Math.PI - 0.2); g.strokeStyle = 'rgba(255,154,60,.18)'; g.lineWidth = 2; g.stroke(); }
    g.restore();
    g.beginPath(); g.arc(cx, cy, R * 0.92, Math.PI * 0.95, Math.PI * 1.55); g.strokeStyle = 'rgba(255,154,60,.35)'; g.lineWidth = 3; g.stroke();
  } else if (m.id === 'europa') {
    const cx = -170, cy = -230, R = 520;
    g.save(); g.translate(cx, cy); g.rotate(0.42); g.scale(1, 0.22);
    g.beginPath(); g.arc(0, 0, 800, 0, TAU); g.strokeStyle = 'rgba(180,230,255,.10)'; g.lineWidth = 90; g.stroke();
    g.beginPath(); g.arc(0, 0, 840, 0, TAU); g.strokeStyle = 'rgba(200,240,255,.25)'; g.lineWidth = 6; g.stroke(); g.restore();
    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fillStyle = rgrad(g, cx + 360, cy + 380, R * 1.1, ['#e8fbff', '#7cc7e0', '#1d4a66', '#0b1d2c']); g.fill();
    g.save(); g.clip(); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2;
    for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo(r() * 400, r() * 300); g.bezierCurveTo(r() * 400, r() * 300, r() * 400, r() * 300, r() * 400, r() * 300); g.stroke(); } g.restore();
    g.save(); g.shadowColor = '#5ce1e6'; g.shadowBlur = 30; g.beginPath(); g.arc(cx, cy, R, 0.1, Math.PI / 2 - 0.1); g.strokeStyle = 'rgba(92,225,230,.6)'; g.lineWidth = 4; g.stroke(); g.restore();
  }
}
function paintPaths(g, G, accent) {
  const tf = g.getTransform(), c = g.canvas;
  const layer = () => { const t = mk(c.width, c.height).getContext('2d'); t.setTransform(tf); t.lineJoin = t.lineCap = 'round'; return t; };
  const stroke = (t, w, col) => { t.lineWidth = w; t.strokeStyle = col; for (const p of G.paths) { t.beginPath(); p.pts.forEach(([x, y], i) => i ? t.lineTo(x, y) : t.moveTo(x, y)); t.stroke(); } };
  const band = layer(); stroke(band, 56, '#03040b');
  const edge = layer(); stroke(edge, 60, accent); edge.globalCompositeOperation = 'destination-out'; stroke(edge, 56, '#000');
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 0.6; g.drawImage(band.canvas, 0, 0);
  g.globalAlpha = 1; g.shadowColor = accent; g.shadowBlur = 10 * tf.a; g.drawImage(edge.canvas, 0, 0);
  g.restore();
}
function paintPad(g, x, y) {
  hexPath(g, x, y, PAD_R); g.fillStyle = grad(g, y - PAD_R, y + PAD_R, ['rgba(80,92,150,.55)', 'rgba(30,36,72,.65)', 'rgba(14,16,36,.75)']); g.fill();
  g.strokeStyle = 'rgba(140,160,255,.4)'; g.lineWidth = 1.5; g.stroke();
  hexPath(g, x, y, PAD_R - 8); g.strokeStyle = 'rgba(140,160,255,.14)'; g.lineWidth = 1; g.stroke();
  g.beginPath(); for (let i = 3; i <= 5; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; g.lineTo(x + Math.cos(a) * (PAD_R - 2), y + Math.sin(a) * (PAD_R - 2)); }
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1.5; g.stroke();
  for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; g.beginPath(); g.arc(x + Math.cos(a) * (PAD_R - 4), y + Math.sin(a) * (PAD_R - 4), 1.5, 0, TAU); g.fillStyle = 'rgba(180,190,255,.4)'; g.fill(); }
}
function paintStatic(g, m, G) { paintBody(g, m); paintPaths(g, G, m.accent); for (const [x, y] of m.pads) paintPad(g, x, y); }
function mapPreview(m) {
  const c = mk(660, 372), g = c.getContext('2d'), G = geo(m);
  g.scale(660 / W, 372 / H);
  g.fillStyle = grad(g, 0, H, [m.bgTop, m.bgBottom]); g.fillRect(0, 0, W, H);
  const sky = makeSky([m.accent], 5);
  for (const s of sky.stars) { g.fillStyle = `rgba(230,236,255,${s.a})`; g.fillRect(s.x, s.y, 2, 2); }
  paintStatic(g, m, G);
  g.fillStyle = m.accent; hexPath(g, m.base[0], m.base[1], 26); g.fill();
  for (const [x, y] of G.portals) { g.beginPath(); g.arc(x, y, 18, 0, TAU); g.fillStyle = '#ff5c7a'; g.fill(); }
  return c;
}
// 맵 레이어: 한 번 굽고 움직이는 요소만 매 프레임
function mapLayers(m, G) {
  const sc = Math.min(2, Math.max(1, (window.devicePixelRatio || 1) * VIEW));
  const back = mk(32, 180), b = back.getContext('2d'); b.fillStyle = grad(b, 0, 180, [m.bgTop, m.bgBottom]); b.fillRect(0, 0, 32, 180);
  const front = mk(W * sc, H * sc), f = front.getContext('2d'); f.scale(sc, sc); paintStatic(f, m, G);
  const r = rng(31), L = { back, front, sky: makeSky([m.accent, '#ff5cc8', '#9b6bff'], 17) };
  if (m.id === 'ceres') {
    const rocks = [0, 1, 2].map(v => bake(60, g => { g.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * TAU, rr = 14 + r() * 10; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath();
      shape(g, rgrad(g, -6, -6, 26, ['#a8523c', '#4a1c18', '#1e0b0e']), 'rgba(255,154,60,.35)', 6); }));
    L.rocks = Array.from({ length: 8 }, (_, i) => ({ img: rocks[i % 3], x: r() * W, y: 80 + r() * 560, vx: 4 + r() * 8, vy: (r() - 0.5) * 3, a: r() * TAU, va: (r() - 0.5) * 0.4, s: 22 + r() * 34 }));
  }
  if (m.id === 'void') L.hole = bake(520, g => {
    g.beginPath(); g.arc(0, 0, 260, 0, TAU); g.fillStyle = rgrad(g, 0, 0, 260, ['rgba(255,255,255,.9)', 'rgba(155,107,255,.55)', 'rgba(74,47,138,.25)', 'rgba(74,47,138,0)']); g.fill();
    for (let arm = 0; arm < 4; arm++) for (let i = 0; i < 160; i++) { const k = i / 160, a = arm * TAU / 4 + k * 7, rr = 20 + k * 230;
      g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr, 5 * (1 - k) + 1.5, 0, TAU); g.fillStyle = `rgba(${arm % 2 ? '255,92,200' : '155,107,255'},${0.5 * (1 - k)})`; g.fill(); }
  });
  return L;
}

// --- 공용 유틸 ---
const alive = e => !e.dead && !e.gone;
const tDmg = t => t.def.damage * Math.pow(LV_DMG, t.lv - 1);
const tRange = t => t.def.range * (1 + LV_RANGE * (t.lv - 1));
const upCost = t => t.lv >= MAX_LV ? null : Math.round(t.def.cost * UPGRADE_COST[t.lv - 1]);
const hpMul = n => 1 + 0.12 * (n - 1) + 0.004 * (n - 1) ** 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function muzzle(t) { const L = towerArt(t.def).muzzle; return { x: t.x + Math.cos(t.ang) * L, y: t.y + Math.sin(t.ang) * L }; }
function blend(mode, fn) { ctx.globalCompositeOperation = mode; fn(); ctx.globalCompositeOperation = 'source-over'; }
const NUM_FONT = '700 22px "Chakra Petch", system-ui, sans-serif';

// --- 파티클 (최대 400, 오래된 것부터 삭제) ---
const MAX_PARTS = 400;
function part(g, o) { g.parts.push(Object.assign({ t: 0, grav: 324, add: false, fade: false }, o)); if (g.parts.length > MAX_PARTS) g.parts.splice(0, g.parts.length - MAX_PARTS); }
function burst(g, x, y, n, cols, r, spd, life, add = false) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = spd * (0.5 + Math.random());
    part(g, { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.4, col: cols[i % cols.length], r, life: life[0] + Math.random() * (life[1] - life[0]), add }); }
}
function smoke(g, x, y, n, spread) {
  for (let i = 0; i < n; i++) part(g, { x: x + (Math.random() - 0.5) * 10, y, vx: (Math.random() - 0.5) * spread, vy: -50 - Math.random() * 70,
    col: i % 2 ? '#6b7299' : '#3b4063', r: 5 + Math.random() * 4, life: 0.4 + Math.random() * 0.35, grav: -40, fade: true, grow: 14 });
}
// --- 이펙트: { t, dur, d(t) } ---
const fx = (g, dur, d) => g.fx.push({ t: 0, dur, d });
function floatText(g, s, x, y, col) {
  fx(g, 0.6, t => { ctx.globalAlpha = Math.min(1, (0.6 - t) / 0.15); ctx.font = NUM_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const yy = y - 60 * t / 0.6; ctx.fillStyle = 'rgba(5,6,13,.9)'; ctx.fillText(s, x + 2, yy + 2); ctx.fillStyle = col; ctx.fillText(s, x, yy); ctx.globalAlpha = 1; });
}
function ringFx(g, x, y, r0, r1, dur, col, w) {
  fx(g, dur, t => blend('lighter', () => { const k = t / dur; ctx.globalAlpha = 1 - k * 0.7; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r0 + (r1 - r0) * k, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }));
}
function glowAt(x, y, r, col, a = 1) { ctx.globalAlpha = a; ctx.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }
function disc(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function bolt(pts) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) { const [ax, ay] = pts[i], [bx, by] = pts[i + 1], L = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / L, ny = (bx - ax) / L, n = 6 + (Math.random() * 3 | 0), seg = [[ax, ay]];
    for (let k = 1; k < n; k++) { const j = (Math.random() - 0.5) * 18; seg.push([ax + (bx - ax) * k / n + nx * j, ay + (by - ay) * k / n + ny * j]); }
    seg.push([bx, by]); out.push(seg); }
  return out;
}

// --- 공격 방식: 새 방식은 핸들러만 추가 ---
const attackHandlers = {
  single: {
    recoil: 0.1,
    fire(t, e, g) {
      const m = muzzle(t), a = t.ang;
      g.projs.push({ kind: 'single', x: m.x, y: m.y, e, tx: e.x, ty: e.y, dmg: tDmg(t), trail: [] });
      fx(g, 0.1, () => blend('lighter', () => { glowAt(m.x, m.y, 22, '#5ce1e6'); disc(m.x, m.y, 8, '#fff');
        ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(a); ctx.fillStyle = '#e8feff'; ctx.fillRect(16, -2.5, 16, 5); ctx.fillRect(-2.5, -32, 5, 16); ctx.fillRect(-2.5, 16, 5, 16); ctx.restore(); }));
      sfx('pulse');
    },
    update(p, dt, g) {
      if (alive(p.e)) { p.tx = p.e.x; p.ty = p.e.y; }
      p.trail.unshift([p.x, p.y]); if (p.trail.length > 6) p.trail.pop();
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = 486 * dt;
      if (d <= step + 4) {
        if (alive(p.e)) g.hurt(p.e, p.dmg, { num: true });
        ringFx(g, p.tx, p.ty, 8, 32, 0.2, '#5ce1e6', 3);
        burst(g, p.tx, p.ty, 8, ['#5ce1e6', '#ffffff'], 2.5, 160, [0.15, 0.3], true);
        return false;
      }
      p.x += dx / d * step; p.y += dy / d * step; return true;
    },
    draw(p) {
      blend('lighter', () => {
        const sz = [6.5, 5.5, 4.5, 3.5, 2.5, 1.5];
        for (let i = p.trail.length - 1; i >= 0; i--) disc(p.trail[i][0], p.trail[i][1], sz[i], i < 2 ? '#5ce1e6' : '#2a8a9e');
        glowAt(p.x, p.y, 16, '#5ce1e6', 0.8); disc(p.x, p.y, 8, '#5ce1e6'); disc(p.x, p.y, 3, '#fff');
      });
    }
  },
  rapid: {
    recoil: 0.1,
    fire(t, e, g) {
      const m = muzzle(t), tx = e.x + (Math.random() - 0.5) * 10, ty = e.y + (Math.random() - 0.5) * 10;
      const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy) || 1, a = t.ang;
      g.projs.push({ kind: 'rapid', x: m.x, y: m.y, ux: dx / d, uy: dy / d, left: d, e, dmg: tDmg(t) });
      fx(g, 0.06, (_, f) => blend('lighter', () => { const L = (g.t * 60 | 0) % 2 ? 16 : 11; ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(a);
        ctx.strokeStyle = '#ffcc4d'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L, 0); ctx.moveTo(0, -L); ctx.lineTo(0, L); ctx.stroke();
        disc(0, 0, 4.5, '#fff'); ctx.restore(); }));
      sfx('rail');
    },
    update(p, dt, g) {
      const s = 1240 * dt;
      if (p.left > s) { p.x += p.ux * s; p.y += p.uy * s; p.left -= s; return true; }
      p.x += p.ux * p.left; p.y += p.uy * p.left;
      if (alive(p.e) && Math.hypot(p.e.x - p.x, p.e.y - p.y) < 26) g.hurt(p.e, p.dmg, {});
      burst(g, p.x, p.y, 3, ['#ffcc4d', '#ffffff'], 2, 180, [0.1, 0.2], true);
      return false;
    },
    draw(p) {
      blend('lighter', () => { const gr = ctx.createLinearGradient(p.x, p.y, p.x - p.ux * 27, p.y - p.uy * 27);
        gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, '#fff'); gr.addColorStop(0.32, '#ffcc4d'); gr.addColorStop(0.7, '#ffcc4d'); gr.addColorStop(1, 'rgba(255,154,60,0)');
        ctx.strokeStyle = gr; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.ux * 27, p.y - p.uy * 27); ctx.stroke(); });
    }
  },
  splash: {
    recoil: 0.2,
    canTarget: e => !e.flying,
    fire(t, e, g) {
      const m = muzzle(t), aim = posAt(e.path, e.d + g.speedOf(e) * 0.75);
      g.projs.push({ kind: 'splash', sx: m.x, sy: m.y, ex: aim.x, ey: aim.y, gx: m.x, gy: m.y, h: 0, t: 0, r: t.def.splash || 60, dmg: tDmg(t), smoke: 0 });
      smoke(g, m.x, m.y, 5, 40); sfx('mortar');
    },
    update(p, dt, g) {
      p.t += dt; const k = Math.min(1, p.t / 0.75);
      p.gx = p.sx + (p.ex - p.sx) * k; p.gy = p.sy + (p.ey - p.sy) * k; p.h = 140 * 4 * k * (1 - k);
      if ((p.smoke -= dt) <= 0) { p.smoke = 0.04; smoke(g, p.gx, p.gy - p.h, 1, 15); }
      if (k < 1) return true;
      for (const e of g.enemies) if (alive(e) && !e.flying && Math.hypot(e.x - p.ex, e.y - p.ey) <= p.r) g.hurt(e, p.dmg, { num: true });
      const R = p.r, x = p.ex, y = p.ey;

        const k1 = Math.min(1, t / 0.3); ctx.globalAlpha = 1 - t / 0.45; ctx.lineWidth = 6; ctx.strokeStyle = '#ff9a3c'; ctx.beginPath(); ctx.arc(x, y, R * k1, 0, TAU); ctx.stroke();
        if (t > 0.08) { ctx.lineWidth = 4; ctx.strokeStyle = '#ff5c7a'; ctx.beginPath(); ctx.arc(x, y, R * 0.75 * Math.min(1, (t - 0.08) / 0.3), 0, TAU); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }));
      burst(g, x, y, 18, ['#ff9a3c', '#ffcc4d', '#ff5c7a', '#ffffff'], 3.5, 240, [0.25, 0.55], true);
      smoke(g, x, y, 6, 110);

    },
    drawGround(p, g) {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(p.gx, p.gy, 11, 3, 0, 0, TAU); ctx.fill();
      if ((g.t * 10 | 0) % 2 === 0) { const h = p.r * 0.6, L = 14; ctx.strokeStyle = '#ff5c7a'; ctx.lineWidth = 3; ctx.lineCap = 'square'; ctx.beginPath();
        for (const sx of [-1, 1]) for (const sy of [-1, 1]) { const cx = p.ex + sx * h, cy = p.ey + sy * h; ctx.moveTo(cx - sx * L, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy - sy * L); }
        ctx.stroke(); }
    },
    draw(p) {
      const x = p.gx, y = p.gy - p.h;
      disc(x, y, 11, '#05060d');
      ctx.fillStyle = rgrad(ctx, x - 3, y - 3, 10, ['#d7c4ff', '#9b6bff', '#4a2f8a']); ctx.beginPath(); ctx.arc(x, y, 8.5, 0, TAU); ctx.fill();
      blend('lighter', () => { glowAt(x, y - 12, 8, '#ffcc4d'); disc(x, y - 12, 2.5, '#fff'); });
    }
  },
  beam: {
    recoil: 0,
    tick(t, e, dt, g) {
      if (!e) { t.beam = null; return; }
      if (!t.beam || t.beam.e !== e) { t.beam = { e, acc: 0, nt: 0 }; sfx('beam'); }
      const d = tDmg(t) * dt;
      e.chillAmt = e.chill > 0 ? Math.max(e.chillAmt, t.def.slow) : t.def.slow; e.chill = t.def.slowTime;
      g.hurt(e, d, { raw: true });
      t.beam.acc += d; t.beam.nt += dt;
      if (t.beam.nt >= 0.4) { floatText(g, '-' + Math.round(t.beam.acc), e.x, e.y - 18, '#c8f6ff'); t.beam.acc = 0; t.beam.nt = 0; }
      if (Math.random() < 0.35) part(g, { x: e.x + (Math.random() - 0.5) * 24, y: e.y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 30, col: Math.random() < 0.5 ? '#c8f6ff' : '#9be8ff', r: 2, life: 0.35, grav: 0, add: true, fade: true });
    },
    drawBeam(t, g) {
      const b = t.beam; if (!b || !alive(b.e)) return;
      const m = muzzle(t), ex = b.e.x, ey = b.e.y, L = Math.hypot(ex - m.x, ey - m.y) || 1, nx = -(ey - m.y) / L, ny = (ex - m.x) / L;
      blend('lighter', () => {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const [w, col, amp] of [[10, 'rgba(155,232,255,.35)', 3.5], [4, '#c8f6ff', 1.2]]) {
          ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath();
          for (let i = 0; i <= 14; i++) { const k = i / 14, o = Math.sin(k * 9 - g.t * 30) * amp * Math.sin(k * Math.PI); ctx.lineTo(m.x + (ex - m.x) * k + nx * o, m.y + (ey - m.y) * k + ny * o); }
          ctx.stroke();
        }
        glowAt(m.x, m.y, 12, '#9be8ff'); glowAt(ex, ey, 18, '#9be8ff', 0.8);

    }
  },
  chain: {
    recoil: 0.12,
    fire(t, e, g) {
      const m = muzzle(t), hits = [e], pts = [[m.x, m.y], [e.x, e.y]];
      let dmg = tDmg(t), cur = e;
      g.hurt(e, dmg, { num: true });
      for (let i = 0; i < t.def.chain; i++) {
        dmg *= t.def.chainFalloff;
        let best = null, bd = t.def.chainRange;
        for (const o of g.enemies) { if (!alive(o) || hits.includes(o)) continue; const d = Math.hypot(o.x - cur.x, o.y - cur.y); if (d <= bd) { bd = d; best = o; } }
        if (!best) break;
        hits.push(best); pts.push([best.x, best.y]); g.hurt(best, dmg, { num: true }); cur = best;
      }
      for (const [x, y] of pts.slice(1)) burst(g, x, y, 5, ['#5ce1e6', '#ffffff', '#9b6bff'], 2, 180, [0.1, 0.25], true);
      const fxo = { k: -1, segs: null };
      fx(g, 0.12, (tt) => { const k = tt < 0.06 ? 0 : 1; if (k !== fxo.k) { fxo.k = k; fxo.segs = bolt(pts); }  // 0.12초에 두 번 다시 그려 지직거림
        blend('lighter', () => { ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          for (const [w, col] of [[7, 'rgba(155,107,255,.55)'], [3.5, 'rgba(92,225,230,.8)'], [1.5, '#fff']]) { ctx.strokeStyle = col; ctx.lineWidth = w;
            for (const s of fxo.segs) { ctx.beginPath(); s.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); } }
          glowAt(m.x, m.y, 20, '#ff5cc8'); }); });
      sfx('zap');
    }
  }
};

// --- 적 특성: onSpawn / onHit / onDeath / onUpdate 훅 ---
const traitHandlers = {
  armor: {},  // 피해 공식 max(1, damage - armor)는 Game.hurt에서 모든 적에 적용 (beam은 무시)
  split: {
    onDeath(e, g) { for (let i = 0; i < SPLIT_COUNT; i++) g.spawn(SPLIT_CHILD, e.pi, e.d + (i - 1) * 14, SPLIT_CHILD.hp, e.path); }
  },
  boss: {
    onUpdate(e, g) {
      if (e.summoned || e.hp > e.maxHp / 2) return;
      e.summoned = true;
      const def = ENEMIES.find(d => d.id === BOSS_SUMMON.id);
      for (let i = 0; i < BOSS_SUMMON.count; i++) g.spawn(def, e.pi, Math.max(0, e.d - 16 - i * 18), def.hp * hpMul(g.wave) * g.diff.hpMul, e.path);
      g.shake(8, 0.25); sfx('summon'); g.bannerMsg('HIVE SPAWN', 'boss', 1.4);
    }
  },
  blink: {
    onUpdate(e, g, dt) {
      if (e.blinkT === undefined) e.blinkT = 3;
      e.blinkT -= dt * (e.chill > 0 ? 0.5 : 1);  // 둔화 중이면 대기 2배
      e.warn = e.blinkT <= 0.3;
      if (e.blinkT > 0) return;
      e.blinkT = 3; e.warn = false;
      ringFx(g, e.x, e.y, 6, 34, 0.3, '#9b6bff', 3);
      e.d += 120; const p = posAt(e.path, e.d); e.x = p.x; e.y = p.y; e.trail = [];
      ringFx(g, e.x, e.y, 34, 6, 0.3, '#9b6bff', 3); sfx('blink');
    }
  },
  flying: {
    onSpawn(e, g) { e.flying = true; e.path = g.G.fly[e.pi]; }
  }
};
const runTrait = (e, hook, ...a) => { for (const tr of e.def.traits) { const h = traitHandlers[tr]; if (h && h[hook]) h[hook](e, ...a); } };

class Game extends Scene {
  constructor(map, diff) {
    super();
    Object.assign(this, { map, diff, G: geo(map), N: map.waves });
    this.credits = diff.credits; this.hp = diff.baseHp;
    this.wave = 0; this.waveActive = false; this.queue = []; this.spawnT = 0;
    this.count = typeof diff.autoWave === 'number' ? diff.autoWave : -1;
    this.towers = map.pads.map(() => null);
    this.enemies = []; this.projs = []; this.fx = []; this.parts = [];
    this.build = -1; this.sel = -1; this.padPop = -1; this.hoverPad = -1; this.touchPad = -1;
    this.speed = 1; this.menu = false; this.confirm = null; this.t = 0; this.playT = 0; this.kills = 0;
    this.shakeT = 0; this.shakeM = 0; this.end = null; this.endT = 0; this.baseHit = 0;
    this.next = this.genWave(1);
    this.L = mapLayers(map, this.G);
  }

  // ---- 웨이브 ----
  genWave(n) {
    const pool = ENEMIES.filter(e => e.unlockWave <= n && !e.traits.includes('boss'));
    const count = Math.min(60, 8 + Math.floor(n * 1.2)), shellCap = Math.floor(count * 0.25);
    const pick = () => pool[Math.random() * pool.length | 0], fresh = pool.find(e => e.unlockWave === n);
    const kinds = fresh ? [fresh] : [];
    const ng = 2 + (Math.random() * 3 | 0);
    while (kinds.length < ng) kinds.push(pick());
    const groups = kinds.map(def => ({ def, n: 0 }));
    let left = count;
    // stinger는 무리 단위(4~6)만
    for (const gr of groups) if (gr.def.id === 'stinger') { const k = 4 + (Math.random() * 3 | 0); if (left >= k + 2) { gr.n = k; left -= k; } else gr.def = pool[0]; }
    let normal = groups.filter(gr => gr.def.id !== 'stinger');
    if (!normal.length) { groups.push({ def: pool[0], n: 0 }); normal = [groups[groups.length - 1]]; }
    normal.forEach((gr, i) => gr.n = Math.floor(left / normal.length) + (i < left % normal.length ? 1 : 0));
    // shell은 웨이브의 25% 이하
    let shells = 0;
    for (const gr of normal) if (gr.def.id === 'shell') { const ok = Math.max(0, Math.min(gr.n, shellCap - shells)); shells += ok;
      const extra = gr.n - ok; gr.n = ok; if (extra) { let o = normal.find(x => x.def.id !== 'shell'); if (!o) { o = { def: pool[0], n: 0 }; groups.push(o); normal.push(o); } o.n += extra; } }
    const list = groups.filter(gr => gr.n > 0), np = this.G.paths.length, queue = [];
    list.forEach((gr, gi) => { for (let k = 0; k < gr.n; k++) queue.push({ def: gr.def, pi: gi % np, delay: k ? gr.def.spawnGap : gi ? 2 : 0 }); });
    const boss = n % BOSS_EVERY === 0 ? Math.floor(n / BOSS_EVERY) : 0, qd = ENEMIES.find(e => e.traits.includes('boss'));
    for (let i = 0; i < boss && qd; i++) queue.push({ def: qd, pi: (list.length + i) % np, delay: i ? qd.spawnGap : 2 });
    return { n, groups: list, boss, bossDef: qd, queue };
  }
  canStart() { return !this.waveActive && this.wave < this.N && !this.end; }
  startWave() {
    if (!this.canStart()) return;
    const early = this.count > 0 ? Math.floor(this.count) * 2 : 0;
    if (early) { this.credits += early; floatText(this, '+' + early, W - 300, 90, '#ffcc4d'); }
    this.wave++; this.queue = this.next.queue.slice(); this.spawnT = 0; this.waveActive = true; this.count = -1;
    const boss = this.next.boss > 0;
    this.next = this.wave < this.N ? this.genWave(this.wave + 1) : null;
    if (boss) { this.bannerMsg('BOSS', 'boss', 2); sfx('summon'); } else { this.bannerMsg('WAVE ' + this.wave, '', 1.3); sfx('wave'); }
    this.prevKey = null;
  }
  spawn(def, pi, d, hp, path) {
    const e = { def, art: enemyArt(def), pi, path: path || this.G.paths[pi], d, hp, maxHp: hp, speed: def.speed * this.diff.speedMul, armor: def.armor,
      reward: Math.round(def.reward * this.diff.rewardMul), flash: 0, hitSlow: 0, chill: 0, chillAmt: 0, anim: Math.random(), seed: Math.random() * 9,
      face: 1, scale: def.scale || 1, x: 0, y: 0, dx: 1, dy: 0, trail: [] };
    runTrait(e, 'onSpawn', this);
    const p = posAt(e.path, d); e.x = p.x; e.y = p.y; e.dx = p.dx; e.dy = p.dy;
    this.enemies.push(e); return e;
  }
  speedOf(e) { return e.speed * (e.hitSlow > 0 ? 0.8 : 1) * (e.chill > 0 ? 1 - e.chillAmt : 1); }
  hurt(e, dmg, o) {
    if (!alive(e)) return;
    const f = o.raw ? dmg : Math.max(1, Math.round(dmg - e.armor));
    e.hp -= f;
    if (!o.raw) { e.flash = 0.12; e.hitSlow = 0.08; }
    if (o.num) floatText(this, '-' + f, e.x, e.y - 18, '#ffffff');
    runTrait(e, 'onHit', this, f);
    if (e.hp > 0) return;
    e.dead = true; this.credits += e.reward; this.kills++;
    burst(this, e.x, e.y, 16, [e.art.color, '#ffffff'], 4, 220, [0.25, 0.55]);
    floatText(this, '+' + e.reward, e.x, e.y - 40, '#ffcc4d'); sfx('kill');
    runTrait(e, 'onDeath', this);
  }
  shake(m, d) { if (REDUCED) return; this.shakeM = this.shakeT > 0 ? Math.max(m, this.shakeM) : m; this.shakeT = Math.max(this.shakeT, d); }
  place(i, ti) {
    const def = TOWERS[ti];
    if (!def || this.towers[i] || this.credits < def.cost) { sfx('error'); return; }
    const [x, y] = this.map.pads[i];
    this.credits -= def.cost;
    this.towers[i] = { def, pad: i, x, y, lv: 1, spent: def.cost, cd: 0, ang: -Math.PI / 2, rec: 0, pri: 0, beam: null };
    this.padPop = -1; this.touchPad = -1; sfx('build');
    burst(this, x, y, 12, [towerArt(def).color, '#ffffff'], 2.5, 140, [0.2, 0.4], true);
  }
  upgrade(t) { const c = upCost(t); if (c == null || this.credits < c) { sfx('error'); return; } this.credits -= c; t.spent += c; t.lv++; sfx('build'); ringFx(this, t.x, t.y, 20, 46, 0.3, towerArt(t.def).color, 3); }
  sell(t) { this.credits += Math.floor(t.spent * SELL_RATE); this.towers[t.pad] = null; this.sel = -1; sfx('sell'); }
  selectBuild(i) { if (i >= TOWERS.length) return; this.build = this.build === i ? -1 : i; this.sel = -1; this.padPop = -1; this.touchPad = -1; }
  bannerMsg(text, cls, dur) {
    const b = $('#banner'); if (!b) return;
    b.textContent = text; b.className = ''; void b.offsetWidth; b.className = 'show ' + cls; b.style.setProperty('--d', dur + 's');
  }

  // ---- 업데이트 ----
  update(dt) {
    if (this.menu) return;
    this.playT += dt;
    for (let i = 0; i < this.speed && scene === this; i++) this.step(dt);
  }
  fxOnly(dt) { this.t += dt; this.tickFx(dt); }
  tickFx(dt) {
    this.fx = this.fx.filter(f => (f.t += dt) < f.dur);
    for (const p of this.parts) { p.t += dt; p.vx *= 0.96; p.vy *= 0.96; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    this.parts = this.parts.filter(p => p.t < p.life);
  }
  step(dt) {
    this.t += dt; this.shakeT -= dt; this.baseHit -= dt;
    if (this.waveActive) {
      this.spawnT -= dt;
      while (this.queue.length && this.spawnT <= 0) { const q = this.queue.shift(); this.spawn(q.def, q.pi, 0, q.def.hp * hpMul(this.wave) * this.diff.hpMul); this.spawnT += this.queue.length ? this.queue[0].delay : 0; }
    }
    if (this.count > 0 && !this.waveActive && !this.end && (this.count -= dt) <= 0) { this.count = -1; this.startWave(); }

    for (const e of this.enemies) {
      if (!alive(e)) continue;
      e.flash -= dt; e.hitSlow -= dt; e.chill -= dt; e.anim += dt;
      runTrait(e, 'onUpdate', this, dt);
      e.d += this.speedOf(e) * dt;
      if (e.d >= e.path.len) {
        e.gone = true; this.hp = Math.max(0, this.hp - e.def.leak); this.shake(10, 0.2); this.baseHit = 0.5; sfx('hurt');
        if (this.hp <= 0 && !this.end) { this.end = 'lose'; this.endT = 1; sfx('lose'); }
        continue;
      }
      const p = posAt(e.path, e.d); e.x = p.x; e.y = p.y; e.dx = p.dx; e.dy = p.dy;
      if (p.dx < -0.2) e.face = -1; else if (p.dx > 0.2) e.face = 1;
      if (e.art.ghost && (this.t * 20 | 0) !== e.gt) { e.gt = this.t * 20 | 0; e.trail.unshift([e.x, e.y]); if (e.trail.length > 4) e.trail.pop(); }
    }

    for (const t of this.towers) {
      if (!t) continue;
      t.rec -= dt; t.cd -= dt;
      const h = attackHandlers[t.def.attack], r = tRange(t), pr = PRIORITIES[t.pri];
      let best = null, bs = -Infinity;
      for (const e of this.enemies) {
        if (!alive(e) || (h.canTarget && !h.canTarget(e)) || (e.x - t.x) ** 2 + (e.y - t.y) ** 2 > r * r) continue;
        const sc = pr.score(e, t); if (sc > bs) { bs = sc; best = e; }
      }
      let aimed = false;
      if (best) { const da = angDiff(t.ang, Math.atan2(best.y - t.y, best.x - t.x)), mx = 540 * Math.PI / 180 * dt;
        t.ang += Math.max(-mx, Math.min(mx, da)); aimed = Math.abs(da) < 0.35; }
      if (h.tick) { h.tick(t, aimed ? best : null, dt, this); continue; }
      if (t.cd <= 0) { if (best && aimed) { h.fire(t, best, this); t.cd += 1 / t.def.rate; t.rec = h.recoil; } else t.cd = 0; }
    }

    this.projs = this.projs.filter(p => attackHandlers[p.kind].update(p, dt, this));
    this.tickFx(dt);
    this.enemies = this.enemies.filter(alive);

    if (this.waveActive && !this.queue.length && !this.enemies.length && !this.end) {
      this.waveActive = false;
      const bonus = 30 + 4 * this.wave; this.credits += bonus;
      if (this.wave >= this.N) { this.end = 'win'; this.endT = 1.4; sfx('clear'); this.bannerMsg('VICTORY', 'gold', 1.4); }
      else { this.bannerMsg(`WAVE CLEAR  +${bonus}`, 'gold', 1.4); if (typeof this.diff.autoWave === 'number') this.count = this.diff.autoWave; }
    }
    if (this.end && (this.endT -= dt) <= 0) setScene(new Result(this, this.end === 'win'));
  }

  // ---- 입력 ----
  padAt(x, y) { let bi = -1, bd = PAD_R + 4; this.map.pads.forEach(([px, py], i) => { const d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; bi = i; } }); return bi; }
  pointer(type, x, y, ev) {
    if (this.menu) return;
    if (type === 'move') { this.hoverPad = this.padAt(x, y); return; }
    if (ev.button === 2) { this.cancel(); return; }
    const i = this.padAt(x, y);
    if (i < 0) { this.sel = -1; this.padPop = -1; this.touchPad = -1; return; }
    if (this.towers[i]) { this.build = -1; this.padPop = -1; this.sel = this.sel === i ? -1 : i; sfx('click'); return; }
    this.sel = -1;
    if (this.build >= 0) {
      if (ev.pointerType === 'touch' && this.touchPad !== i) { this.touchPad = i; this.hoverPad = i; return; }  // 터치: 첫 탭 미리보기, 두 번째 탭 설치
      this.place(i, this.build); return;
    }
    this.padPop = this.padPop === i ? -1 : i; sfx('click');
  }
  cancel() { this.build = -1; this.sel = -1; this.padPop = -1; this.touchPad = -1; }
  key(k) {
    if (this.menu) { if (k === 'Escape' || k === 'p' || k === 'P') { if (this.confirm) { this.confirm = null; this.renderMenu(); } else this.closeMenu(); } return; }
    if (k === 'Escape') { if (this.build >= 0 || this.sel >= 0 || this.padPop >= 0) this.cancel(); else this.openMenu(); }
    else if (k === 'p' || k === 'P') this.openMenu();
    else if (k >= '1' && k <= '9') this.selectBuild(+k - 1);
    else if (k === ' ') this.startWave();
    else if (k === 'f' || k === 'F') this.speed = this.speed % 3 + 1;
  }
  onAct(a, d) {
    const t = this.towers[this.sel];
    switch (a) {
      case 'next': this.startWave(); break;
      case 'speed': this.speed = this.speed % 3 + 1; break;
      case 'mute': toggleMute(); break;
      case 'menu': this.openMenu(); break;
      case 'pick': this.selectBuild(+d.i); break;
      case 'buildAt': if (this.padPop >= 0) this.place(this.padPop, +d.i); break;
      case 'up': if (t) this.upgrade(t); break;
      case 'sell': if (t) this.sell(t); break;
      case 'prio': if (t) t.pri = (t.pri + 1) % PRIORITIES.length; break;
      case 'resume': this.closeMenu(); break;
      case 'restart': case 'quit': this.confirm = a; this.renderMenu(); break;
      case 'no': this.confirm = null; this.renderMenu(); break;
      case 'yes': setScene(this.confirm === 'quit' ? new Title() : new Game(this.map, this.diff)); break;
    }
  }
  openMenu() { this.menu = true; this.cancel(); this.renderMenu(); }
  closeMenu() { this.menu = false; this.confirm = null; $('#menu').classList.add('hidden'); }
  renderMenu() {
    const m = $('#menu'); m.classList.remove('hidden');
    $('#menuP').innerHTML = this.confirm
      ? `<h2>${this.confirm === 'quit' ? 'EXIT' : 'RESTART'}</h2><p>진행 중인 게임은 저장되지 않아요.<br>나갈까요?</p>
         <button class="danger" data-act="yes">나가기</button><button data-act="no">취소</button>`
      : `<h2>PAUSED</h2><button class="primary" data-act="resume">계속하기</button>
         <button data-act="restart">처음부터 다시</button><button data-act="quit">메인 화면으로</button>`;
    $('#menuP button').focus();
  }
  exit() { stopAudio(); this.L = null; }

  showTip(i, card) {

      : d.attack === 'chain' ? `<dt>연쇄</dt><dd>${d.chain}회 · x${d.chainFalloff}</dd>` : d.splash ? `<dt>폭발 반경</dt><dd>${d.splash}</dd>` : '';

      <dt>${d.attack === 'beam' ? '초당 피해' : '피해'}</dt><dd>${d.damage}</dd><dt>사거리</dt><dd>${d.range}</dd>

  }
  syncHud() {
    const el = this.el, set = (k, v, fn) => { if (el['_' + k] !== v) { el['_' + k] = v; fn(v); } };

    const nl = this.waveActive ? '웨이브 진행 중' : this.wave >= this.N ? '마지막 웨이브' : this.count > 0 ? `다음 웨이브 ${Math.ceil(this.count)}s · +${Math.floor(this.count) * 2}` : '다음 웨이브 ▶';

      if (nx.boss) cnt.set(nx.bossDef, nx.boss);
      el.prevT.innerHTML = `다음 웨이브 <span class="num">${nx.n}</span>${nx.boss ? '<span class="btag">BOSS</span>' : ''}`;

    const key = t ? `t${this.sel}:${t.lv}:${t.pri}:${this.credits >= (upCost(t) ?? Infinity)}` : this.padPop >= 0 ? `p${this.padPop}:${TOWERS.map(d => this.credits >= d.cost).join()}` : '';

          ${c == null ? '<button disabled>최대 레벨</button>' : `<button data-act="up" ${this.credits < c ? 'disabled' : ''}>업그레이드 <b>${c}</b></button>`}
          <button data-act="sell">판매 <b>+${Math.floor(t.spent * SELL_RATE)}</b></button>

        pop.innerHTML = `<div class="hd"><span>건설</span></div>` + TOWERS.map((d, i) => `<button class="brow" data-act="buildAt" data-i="${i}" ${this.credits < d.cost ? 'disabled' : ''}><canvas></canvas><span>${d.name}</span><b class="num">${d.cost}</b></button>`).join('');

      pop.style.top = Math.max(68, Math.min(H - 110 - h, py - h / 2)) + 'px';

  }

  /* =====================================================================
     5. RENDER (게임 월드만 캔버스)
     ===================================================================== */
  draw() { this.drawWorld(); this.syncHud(); }
  drawWorld() {
    resetTransform();
    const L = this.L || (this.L = mapLayers(this.map, this.G)), G = this.G;
    ctx.drawImage(L.back, 0, 0, W, H);
    drawSky(L.sky);
    const tm = REDUCED ? 0 : clock;
    if (L.rocks) for (const r of L.rocks) { const x = ((r.x + r.vx * tm) % (W + 120) + W + 120) % (W + 120) - 60, y = r.y + Math.sin(tm * 0.2 + r.a) * 20;
      ctx.save(); ctx.translate(x, y); ctx.rotate(r.a + r.va * tm); ctx.drawImage(r.img, -r.s / 2, -r.s / 2, r.s, r.s); ctx.restore(); }
    if (L.hole) { const [bx, by] = this.map.base; blend('lighter', () => { ctx.globalAlpha = 0.55;
      for (const [s, dir] of [[520, 1], [340, -1.6]]) { ctx.save(); ctx.translate(bx, by); ctx.rotate(tm * 0.15 * dir); ctx.drawImage(L.hole, -s / 2, -s / 2, s, s); ctx.restore(); }
      ctx.globalAlpha = 1; }); }

    if (this.shakeT > 0) ctx.translate((Math.random() * 2 - 1) * this.shakeM, (Math.random() * 2 - 1) * this.shakeM);
    ctx.drawImage(L.front, 0, 0, W, H);
    this.drawFlow(tm);
    this.drawPads();
    for (const [x, y] of G.portals) this.drawPortal(x, y);
    this.drawReactor();
    for (const p of this.projs) { const h = attackHandlers[p.kind]; if (h.drawGround) h.drawGround(p, this); }
    for (const t of this.towers) if (t) this.drawTower(t);
    for (const e of this.enemies) if (!e.flying) this.drawEnemy(e);
    for (const e of this.enemies) if (e.flying) this.drawEnemy(e);
    for (const t of this.towers) if (t && attackHandlers[t.def.attack].drawBeam) attackHandlers[t.def.attack].drawBeam(t, this);
    for (const p of this.projs) attackHandlers[p.kind].draw(p, this);
    for (const p of this.parts) if (!p.add) this.drawPart(p);
    blend('lighter', () => { for (const p of this.parts) if (p.add) this.drawPart(p); });
    for (const f of this.fx) f.d(f.t);
    resetTransform();
  }
  drawPart(p) {
    const k = p.t / p.life; ctx.globalAlpha = p.fade ? Math.max(0, 1 - k) * 0.7 : Math.min(1, (1 - k) * 2.5);
    disc(p.x, p.y, p.r + (p.grow || 0) * k, p.col); ctx.globalAlpha = 1;
  }
  drawFlow(tm) {
    ctx.strokeStyle = this.map.accent; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 0.2;
    ctx.beginPath();
    for (const p of this.G.paths) for (let d = (tm * 36) % 64; d < p.own; d += 64) {
      const q = posAt(p, d), c = Math.hypot(q.dx, q.dy) || 1, ux = q.dx / c, uy = q.dy / c;
      ctx.moveTo(q.x - ux * 6 - uy * 8, q.y - uy * 6 + ux * 8); ctx.lineTo(q.x + ux * 3, q.y + uy * 3); ctx.lineTo(q.x - ux * 6 + uy * 8, q.y - uy * 6 - ux * 8);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  drawPads() {
    const pads = this.map.pads, acc = this.map.accent;
    if (this.build >= 0) { const a = 0.35 + 0.2 * Math.sin(clock * 4);
      blend('lighter', () => { for (let i = 0; i < pads.length; i++) if (!this.towers[i]) { const [x, y] = pads[i];
        hexPath(ctx, x, y, PAD_R); ctx.globalAlpha = a * 0.25; ctx.fillStyle = acc; ctx.fill(); ctx.globalAlpha = a; ctx.strokeStyle = acc; ctx.lineWidth = 2.5; ctx.stroke(); } ctx.globalAlpha = 1; }); }
    const hp = this.hoverPad;
    if (hp >= 0 && !this.towers[hp] && (this.build >= 0 || this.padPop === hp)) {
      const [x, y] = pads[hp], def = TOWERS[this.build >= 0 ? this.build : 0];
      if (this.build >= 0) this.drawRange(x, y, def.range, this.credits >= def.cost ? acc : '#ff5c7a');
      hexPath(ctx, x, y, PAD_R + 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (this.padPop >= 0) { const [x, y] = pads[this.padPop]; hexPath(ctx, x, y, PAD_R + 2); ctx.strokeStyle = '#ffcc4d'; ctx.lineWidth = 2.5; ctx.stroke(); }
    const t = this.towers[this.sel]; if (t) this.drawRange(t.x, t.y, tRange(t), '#ffffff');
  }
  drawRange(x, y, r, col) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.globalAlpha = 0.07; ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = 0.85; ctx.setLineDash([7, 7]); ctx.lineDashOffset = -clock * 12; ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  drawPortal(x, y) {
    const k = 0.5 + 0.5 * Math.sin(clock * 4);
    blend('lighter', () => { glowAt(x, y, 46 + 8 * k, '#ff5c7a', 0.55 + 0.25 * k);
      ctx.strokeStyle = '#ffd0da'; ctx.lineWidth = 2.5; ctx.beginPath();
      const r = rng(Math.round(x * 7 + y)); ctx.moveTo(x, y - 24);
      for (let i = 1; i <= 6; i++) ctx.lineTo(x + (r() - 0.5) * 14, y - 24 + i * 8);
      ctx.moveTo(x, y - 4); ctx.lineTo(x + 10, y - 10); ctx.moveTo(x, y + 6); ctx.lineTo(x - 10, y + 12); ctx.stroke(); });
  }
  drawReactor() {
    const [x, y] = this.map.base, low = this.hp / this.diff.baseHp <= 0.3;
    const red = this.baseHit > 0 ? (this.t * 12 | 0) % 2 === 0 : low && (clock * 3 | 0) % 2 === 0, col = red ? '#ff5c7a' : this.map.accent;
    blend('lighter', () => glowAt(x, y, 70, col, 0.6));
    ctx.save(); ctx.translate(x, y);
    ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.setLineDash([16, 10]);
    ctx.rotate(clock * 0.8); ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.stroke();
    ctx.rotate(-clock * 2); ctx.lineWidth = 2; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.arc(0, 0, 50, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    hexPath(ctx, x, y, 28); ctx.fillStyle = rgrad(ctx, x - 8, y - 8, 36, ['#ffffff', col, '#141831']); ctx.fill(); ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
    hexPath(ctx, x, y, 14); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
  }
  drawTower(t) {
    const A = towerArt(t.def), h = attackHandlers[t.def.attack], rk = h.recoil ? Math.max(0, t.rec / h.recoil) * 5 : 0;
    if (t.lv >= MAX_LV) blend('lighter', () => glowAt(t.x, t.y, 52, A.color, 0.35 + 0.2 * Math.sin(clock * 3 + t.pad)));
    ctx.drawImage(A.base[t.lv - 1], t.x - 48, t.y - 48, 96, 96);
    ctx.save(); ctx.translate(t.x - Math.cos(t.ang) * rk, t.y - Math.sin(t.ang) * rk); ctx.rotate(t.ang); ctx.drawImage(A.tur[t.lv - 1], -48, -48, 96, 96); ctx.restore();
    if (t.pad === this.sel) { hexPath(ctx, t.x, t.y, PAD_R + 2); ctx.strokeStyle = '#ffcc4d'; ctx.lineWidth = 2.5; ctx.stroke(); }
  }
  drawEnemy(e) {
    const A = e.art, fr = Math.floor(e.anim * 16) % FRAMES, s = A.size * e.scale * (1 + 0.02 * Math.sin(this.t * 3 + e.seed));
    const kb = e.flash > 0 ? 5 : 0, bob = e.flying ? Math.sin(this.t * 5 + e.seed) * 3 : 0;
    const x = e.x - e.dx * kb, y = e.y - e.dy * kb + bob - (e.flying ? 14 : 0), body = A.body * e.scale;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.flying ? e.y + 12 : e.y + body * 0.42, body * 0.45, body * 0.13, 0, 0, TAU); ctx.fill();
    for (let i = e.trail.length - 1; i >= 0; i--) { ctx.globalAlpha = 0.22 - i * 0.05; ctx.drawImage(A.frames[fr], e.trail[i][0] - s / 2, e.trail[i][1] - s / 2, s, s); }
    ctx.globalAlpha = e.warn ? ((this.t * 20 | 0) % 2 ? 0.25 : 1) : 1;
    ctx.save(); ctx.translate(x, y); if (e.face < 0) ctx.scale(-1, 1);
    ctx.drawImage(A.frames[fr], -s / 2, -s / 2, s, s);
    if (e.flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, e.flash / 0.12) * 0.85; ctx.drawImage(A.white[fr], -s / 2, -s / 2, s, s); }
    ctx.restore(); ctx.globalAlpha = 1;
    if (e.chill > 0) { ctx.strokeStyle = 'rgba(155,232,255,.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y, body * 0.62, body * 0.5, 0, 0, TAU); ctx.stroke(); }
    const bw = Math.max(30, body), by = y - body * 0.55 - 12, r = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = 'rgba(5,6,13,.85)'; ctx.beginPath(); ctx.roundRect(x - bw / 2 - 1, by - 1, bw + 2, 7, 3); ctx.fill();
    ctx.fillStyle = r <= 0.4 ? '#ff5c7a' : '#b5ff5c'; ctx.beginPath(); ctx.roundRect(x - bw / 2, by, Math.max(2, bw * r), 5, 2.5); ctx.fill();
  }
}

/* =====================================================================
   INPUT
   ===================================================================== */
function toLogical(ev) { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', ev => { ev.preventDefault(); initAudio(); const [x, y] = toLogical(ev); mouse.x = x; mouse.y = y; scene.pointer('down', x, y, ev); });
cv.addEventListener('pointermove', ev => { const [x, y] = toLogical(ev); mouse.x = x; mouse.y = y; scene.pointer('move', x, y, ev); });
cv.addEventListener('contextmenu', ev => ev.preventDefault());
ui.addEventListener('mousedown', ev => { if (ev.target.closest('button')) ev.preventDefault(); });  // 마우스 클릭으로 포커스가 남아 Space가 버튼을 다시 누르지 않게
ui.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  initAudio(); sfx('click'); scene.onAct(b.dataset.act, b.dataset);
});
addEventListener('keydown', ev => {
  initAudio();
  const onBtn = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if ((ev.key === ' ' || ev.key === 'Enter') && onBtn) return;  // 키보드로 고른 버튼은 브라우저 기본 동작
  if (ev.key === ' ') ev.preventDefault();
  if (!ev.repeat) scene.key(ev.key);
});

/* =====================================================================
   AUDIO (WebAudio 8비트 효과음, 첫 입력 후 생성)
   ===================================================================== */
let actx = null, master = null, noiseBuf = null, muted = false;
const lastSfx = {}, liveNodes = new Set();
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); master = actx.createGain(); master.gain.value = muted ? 0 : 0.35; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate / 2, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.35; }
function track(n) { liveNodes.add(n); n.onended = () => liveNodes.delete(n); }
function stopAudio() { for (const n of liveNodes) { try { n.stop(); } catch (e) {} } liveNodes.clear(); }
function tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0) {
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02); track(o);
}
function noise(dur, vol, freq = 1000, type = 'lowpass') {
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur); track(s);
}
const arp = (fs, step, type, vol) => fs.forEach((f, i) => tone(f, f, step, type, vol, i * step));
const SFX = {
  pulse: () => tone(880, 330, 0.08, 'square', 0.12),
  rail: () => tone(1500, 900, 0.025, 'square', 0.05),
  mortar: () => { tone(160, 70, 0.12, 'triangle', 0.3); noise(0.08, 0.12, 800); },
  boom: () => { noise(0.35, 0.45, 700); tone(110, 40, 0.3, 'triangle', 0.35); },
  beam: () => tone(1200, 1800, 0.12, 'sine', 0.1),
  zap: () => { noise(0.12, 0.25, 2500, 'highpass'); tone(1800, 600, 0.08, 'sawtooth', 0.06); },
  blink: () => tone(900, 200, 0.15, 'sine', 0.12),
  kill: () => tone(500, 1000, 0.06, 'square', 0.1),
  hurt: () => tone(220, 55, 0.25, 'sawtooth', 0.3),
  wave: () => arp([440, 554, 659], 0.08, 'square', 0.14),
  clear: () => arp([523, 659, 784, 1047], 0.12, 'square', 0.16),
  lose: () => arp([392, 330, 262, 196], 0.18, 'triangle', 0.3),
  summon: () => tone(90, 420, 0.45, 'sawtooth', 0.22),
  build: () => tone(330, 660, 0.08, 'square', 0.12),
  sell: () => tone(660, 330, 0.08, 'square', 0.12),
  click: () => tone(660, 660, 0.03, 'square', 0.07),
  error: () => tone(150, 110, 0.1, 'square', 0.12)
};
function sfx(n) {
  if (!actx || muted || !SFX[n]) return;
  const now = actx.currentTime; if (now - (lastSfx[n] || -1) < 0.04) return;  // 연사 겹침 방지
  lastSfx[n] = now; SFX[n]();
}

/* =====================================================================
   LOOP: 로직 60Hz 고정, 렌더 rAF
   ===================================================================== */
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - lastT) / 1000); lastT = now; clock += dt; acc += dt;
  while (acc >= DT) { scene.update(DT); acc -= DT; }
  scene.draw();
  requestAnimationFrame(frame);
}
setScene(new Title());
requestAnimationFrame(frame);
</script>
